<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Open Graph / social share preview -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-share.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/images/og-share.png' | absolute_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/uong_logo.png' | relative_url }}">
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner">
        <a href="{{ '/' | relative_url }}" class="nav-brand">
          <img src="{{ '/assets/images/uong_logo.png' | relative_url }}" alt="{{ site.title }}" width="34" height="34">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/about' | relative_url }}">About</a></li>
          <li><a href="{{ '/projects' | relative_url }}">Projects</a></li>
          <li><a href="{{ '/professional-activity' | relative_url }}">Professional Activity</a></li>
          <li><a href="https://linkedin.com/in/josephuong" target="_blank" rel="noopener">LinkedIn</a></li>
        </ul>
      </div>
    </nav>
    <script>
      (function() {
        var btn = document.querySelector('.nav-toggle');
        var menu = document.querySelector('.nav-links');
        btn.addEventListener('click', function() {
          var open = menu.classList.toggle('is-open');
          btn.setAttribute('aria-expanded', open);
        });
        menu.querySelectorAll('a').forEach(function(a) {
          a.addEventListener('click', function() {
            menu.classList.remove('is-open');
            btn.setAttribute('aria-expanded', 'false');
          });
        });
      })();
    </script>
    <main class="page-content">
      <h1 class="site-author">{{ site.author }}</h1>
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
    </footer>
  </body>
</html>
